# Docker: nginx in front of the php-fpm container `app` (same paths as deploy/nginx-bookmarks-root.conf).
# TLS is terminated by your reverse proxy; its X-Forwarded-Proto: https marks the request as HTTPS (secure session cookie).
map $http_x_forwarded_proto $bm_https { https on; default ''; }

server {
    listen 80;
    server_tokens off;
    include /etc/nginx/bookmarks-security.conf;

    location ~ /\. { deny all; }
    location = / {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /srv/bookmarks/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param HTTPS $bm_https if_not_empty;
        fastcgi_pass app:9000;
    }
    location ~ ^/([A-Za-z0-9-]+\.php)$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /srv/bookmarks/public/$1;
        fastcgi_param SCRIPT_NAME /$1;
        fastcgi_param HTTPS $bm_https if_not_empty;
        fastcgi_pass app:9000;
    }
    location / { root /srv/bookmarks/public; index index.php; }
}
