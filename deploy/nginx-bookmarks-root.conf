# Bookmarks app at the root of bookmarks.villiger.dev (only public/ is mapped).
location ~ /\. { deny all; }
location = / {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /srv/bookmarks/public/index.php;
    fastcgi_param SCRIPT_NAME /index.php;
    fastcgi_pass unix:/run/php-fpm/php-fpm.sock;
}
location ~ ^/([A-Za-z0-9-]+\.php)$ {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /srv/bookmarks/public/$1;
    fastcgi_param SCRIPT_NAME /$1;
    fastcgi_pass unix:/run/php-fpm/php-fpm.sock;
}
location / { root /srv/bookmarks/public; index index.php; }
