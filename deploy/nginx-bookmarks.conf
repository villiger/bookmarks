# Include inside the IP/default server block, BEFORE `include /etc/nginx/php_fastcgi.conf;`
#   include /etc/nginx/bookmarks.conf;
# App in /srv/bookmarks; only public/ is reachable. src/, data/, bin/, config.php etc. are never mapped.
location ~ ^/bookmarks/(data|src|bin|deploy)(/|$) { return 404; }
location ~ ^/bookmarks/(config.*|schema\.sql|seed_tags\.txt|README\.md|.*\.(sqlite|db|sql|log))$ { return 404; }
location = /bookmarks { return 301 /bookmarks/; }
location = /bookmarks/ {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /srv/bookmarks/public/index.php;
    fastcgi_param SCRIPT_NAME /bookmarks/index.php;
    fastcgi_pass unix:/run/php-fpm/php-fpm.sock;
}
location ~ ^/bookmarks/([A-Za-z0-9-]+\.php)$ {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /srv/bookmarks/public/$1;
    fastcgi_param SCRIPT_NAME /bookmarks/$1;
    fastcgi_pass unix:/run/php-fpm/php-fpm.sock;
}
location /bookmarks/ {
    alias /srv/bookmarks/public/;   # static: style.css
    index index.php;
}
