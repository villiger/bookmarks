# Include inside the IP/default server block (or add as its own server block).
# App lives in /srv/bookmarks; only public/ is web-reachable; data/ and src/ are not.
# Defense in depth (alias already exposes only public/):
location ~ ^/bookmarks/(data|src|bin|deploy)/ { return 404; }
location ~ ^/bookmarks/(config.*\.php|schema\.sql|.*\.(sqlite|db|sql|log))$ { return 404; }
location ^~ /bookmarks/ {
    alias /srv/bookmarks/public/;
    index index.php;
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $request_filename;
        fastcgi_pass unix:/run/php-fpm/php-fpm.sock;
    }
}
location = /bookmarks { return 301 /bookmarks/; }
