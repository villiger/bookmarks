# Security headers for bookmarks.villiger.dev (include inside the server block).
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
# No inline scripts or handlers and no eval: all behaviour is in public/app.js (htmx runs with allowEval=false). Images come from any site (favicons, thumbnails).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src * data:; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'none'; object-src 'none'" always;
# Only the methods the app uses.
if ($request_method !~ ^(GET|HEAD|POST)$) { return 405; }
